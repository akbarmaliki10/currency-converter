<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="white" stroke-opacity="0.2" stroke-width="1.5" fill="none"/>

  <!-- Specular top highlight -->
  <path d="M 2 18 C 2 8 8 2 18 2 L 46 2 C 56 2 62 8 62 18 C 48 24 16 24 2 18 Z" fill="white" fill-opacity="0.08"/>

  <!-- Orbiting exchange arrows -->
  <!-- Top clockwise arrow (White) -->
  <path d="M 13 31 A 20.5 20.5 0 0 1 48 19" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="43,13 52,19 46,26" fill="#FFFFFF"/>

  <!-- Bottom clockwise arrow (Vibrant Cyan) -->
  <path d="M 51 33 A 20.5 20.5 0 0 1 16 45" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="21,51 12,45 18,38" fill="#38BDF8"/>

  <!-- Central gold currency coin -->
  <g filter="url(#shadow)">
    <circle cx="32" cy="32" r="13.5" fill="url(#coinGrad)"/>
    <circle cx="32" cy="32" r="12" stroke="#FEF08A" stroke-width="1" stroke-opacity="0.9" fill="none"/>
    
    <!-- Dollar currency sign -->
    <path d="M 32 23 V 41" stroke="#3B0764" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 35.8 27 C 35.8 25 34 24 32 24 C 29.8 24 28.2 25.2 28.2 27 C 28.2 29.8 35.8 29.2 35.8 33 C 35.8 35 34 36 32 36 C 29.6 36 28.2 34.8 28.2 33" stroke="#3B0764" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>